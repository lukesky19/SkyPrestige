# DO NOT TOUCH! This is used to update the config file format if needed.
config-version: 1.0.0.1
gui-name: "Exchange Prestige Points"
gui-type: CHEST_54
pages:
    -   filler:
            item-type: gray_stained_glass_pane
            name: " "
            amount: 1
        next-page:
            item:
                item-type: arrow
                name: "<white>Next Page"
                amount: 1
            slot: 47
        prev-page:
            item:
                item-type: arrow
                name: "<white>Previous Page"
                amount: 1
            slot: 51
        exit:
            item:
                item-type: barrier
                name: "<red>Click to close the GUI.</red>"
                amount: 1
            slot: 49
        prestige-points:
            item:
                item-type: gold_nugget
                name: "<red>Prestige Points Balance</red>"
                lore:
                    - "<gray>You will return to the confirm"
                    - "<gray>prestige GUI if you came from there."
                amount: 1
            slot: 53
        exchange-buttons:
            -   display-item:
                    item-type: diamond
                    name: "<white>1 Diamond.</white>"
                    lore:
                        - "<gray>Price:</gray> <white>50 Prestige Points</white>"
                    amount: 1
                exchange-item:
                    item-type: diamond
                    amount: 1
                slot: 10
                exchange-points: 50
            -   display-item:
                    item-type: netherite_scrap
                    name: "<white>1 Netherite Scrap.</white>"
                    lore:
                        - "<gray>Price:</gray> <white>100 Prestige Points</white>"
                    amount: 1
                exchange-commands:
                    - give %player_name% netherite_scrap 1
                slot: 11
                exchange-points: 100