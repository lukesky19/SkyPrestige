# DO NOT TOUCH! This is used to update the config file format if needed.
config-version: 1.1.0.0
gui-name: "Confirm Prestige"
gui-type: CHEST_54
# The slot to display the blueprint bundle at.
blueprint-button-slot: 0
filler:
    item-type: gray_stained_glass_pane
    name: " "
    amount: 1
confirm-button:
    item:
        item-type: emerald_block
        name: "<green>Click to confirm prestige.</green>"
        lore:
            - "<gray>By prestiging your island, your island will be reset"
            - "<gray>and a new island will be created based on the blueprint selected."
            - ""
            - "<gray>The effects of prestiging will apply to offline players when they log on next."
        amount: 1
    slot: 3
cancel-button:
    item:
        item-type: redstone_block
        name: "<red>Click to cancel the prestige.</red>"
        lore:
            - "<gray>By cancelling the prestige, nothing will be reset"
            - "<gray>and you will not prestige."
        amount: 1
    slot: 5
rewards-button:
    item:
        item-type: barrel
        name: "<white>Click to view prestige rewards."
        lore:
            - "<white>These are the rewards given after you prestige your island.</white>"
            - "<white>Rewards are given to each island member.</white>"
        amount: 1
    slot: 53
keep-members:
    item:
        item-type: armor_stand
        name: "<white>Island Members"
        lore:
            - "<gray>Island Members will be carried over on prestige."
        amount: 1
    slot: 10
keep-flags:
    item:
        item-type: red_banner
        name: "<white>Island Flags"
        lore:
            - "<gray>Island Flags will be carried over on prestige."
        amount: 1
    slot: 11
keep-command-ranks:
    item:
        item-type: tripwire_hook
        name: "<white>Island Ranks"
        lore:
            - "<gray>Island Ranks will be carried over on prestige."
        amount: 1
    slot: 12
