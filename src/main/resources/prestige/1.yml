# DO NOT TOUCH! This is used to update the config file format if needed.
config-version: 1.1.0.0
prestige-level: 1
scale-factor: 2.5
required-prestige-points: 100
prestige-settings:
    player-settings:
        inventory-settings:
            reset-inventory: true
            keep-infinite-sell-wands: false
        ender-chest-settings:
            reset-ender-chest: true
            keep-infinite-sell-wands: false
        reset-exp: true
        reset-money: true
        reset-auction-items: true
        play-time-settings:
            reset-session: false
            reset-daily: false
            reset-weekly: false
            reset-monthly: false
            reset-total: false
    island-settings:
        keep-island-size: false
        keep-generator-upgrades: false
        reset-prestige-points: true
        remove-required-prestige-points: false
    give-starting-money-to-all-island-members: false
    starting-money: 2000.0
reward-config:
    item-rewards:
        -   display-item:
                item-type: netherite_scrap
                amount: 1
                lore:
                    - "<gray>This reward is only given to the player who prestiged the island.</gray>"
            give-to-all-island-members: false
            reward-item:
                item-type: netherite_scrap
                amount: 1
    command-rewards:
        -   display-item:
                item-type: diamond
                amount: 1
                lore:
                    - "<gray>This reward is only given to the player who prestiged the island.</gray>"
            give-to-all-island-members: false
            commands:
                - "give %player_name% diamond 1"