# DO NOT TOUCH! This is used to update the config file format if needed.
config-version: 1.0.0.0
# The formula used to scale requirements.
scale-formula: r*(1+((p-1)/(k)))
# Requires SkyPlayTime
award-points-while-afk: false
# Should stacked blocks and entities be considered when rewarding prestige points?
accurate-rosestacker: true
# Should custom enchantments from SkyEnchants that break multiple blocks increment prestige points?
sky-enchants-multi-break: true
