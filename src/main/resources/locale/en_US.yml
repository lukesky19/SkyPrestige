        seconds: "<aqua><seconds></aqua> second(s)"
        suffix: ""
    shop-multiplier-messages:
        not-on-island: "<red>You must be on your island to purchase an island multiplier.</red>"
        multiplier-active: "<red>You cannot purchase this multiplier as one is already active.</red>"
        higher-multiplier-active: "<red>You cannot purchase this multiplier as a higher one is already active.</red>"
        multiplier-time-max: "<red>The multiplier time is already at or would exceed the maximum time allowed.</red>"
