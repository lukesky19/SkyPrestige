# DO NOT TOUCH! This is used to update the config file format if needed.
config-version: 2.0.0.0
prefix: "<green><bold>SkyPrestige</bold></green><gray> ▪ </gray>"
help:
    - "<green>SkyPrestige is developed by <white><bold>lukeskywlker19</bold></white>.</green>"
    - "<green>Source code is released on GitHub: <click:OPEN_URL:https://github.com/lukesky19><yellow><underlined><bold>https://github.com/lukesky19</bold></underlined></yellow></click></green>"
    - " "
    - "<green><bold>List of Commands:</bold></green>"
    - "<white>/</white><green>skyprestige</green>"
    - "<white>/</white><green>skyprestige</green> <yellow>help</yellow>"
    - "<white>/</white><green>skyprestige</green> <yellow>reload</yellow>"
    - "<white>/</white><green>skyprestige</green> <yellow>rewards [prestige] [level]</yellow>"
    - "<white>/</white><green>skyprestige</green> <yellow>rewards [opt-in | opt-out]</yellow>"
    - "<white>/</white><green>skyprestige</green> <yellow>vault</yellow>"
    - "<white>/</white><green>skyprestige</green> <yellow>values</yellow>"
    - "<white>/</white><green>skyprestige</green> <yellow>info</yellow>"
    - "<white>/</white><green>skyprestige</green> <yellow>requirements</yellow>"
    - "<white>/</white><green>skyprestige</green> <yellow>level set <island_id> <level></yellow>"
    - "<white>/</white><green>skyprestige</green> <yellow>multiplier event</yellow>"
    - "<white>/</white><green>skyprestige</green> <yellow>multiplier <add | remove | set> <amount></yellow>"
    - "<white>/</white><green>skyprestige</green> <yellow>multiplier get [additional | event | total]</yellow>"
    - "<white>/</white><green>skyprestige</green> <yellow>points <add | remove | set> <island_id> <amount></yellow>"
    - "<white>/</white><green>skyprestige</green> <yellow>points get <island_id></yellow>"
    - "<white>/</white><green>skyprestige</green> <yellow>exempt <island_id></yellow>"
    - "<white>/</white><green>skyprestige</green> <yellow>unexempt <island_id></yellow>"
    - "<white>/</white><green>skyprestige</green> <yellow>leaderboard</yellow>"
reload: "<green>The plugin has reloaded successfully.</green>"
gui-open-error: "<red>Unable to open this GUI because of a configuration error.</red>"
island-data-not-found: "<red>No island data was found for the island.</red>"
prestige-level-updated: "<green>Island <island_id> had their prestige level set to <prestige_level>.</green>"
prestige-messages:
    prestige-player-only: "<red>Only players are able to prestige islands.</red>"
    prestige-level-max: "<red>Your island is currently at the max prestige level.</red>"
    player-in-wrong-world: "<red>You must be in an island world to prestige.</red>"
    player-not-on-island: "<red>You must be on your island to prestige it.</red>"
    island-not-owned: "<red>You cannot prestige an island that is not owned.</red>"
    player-not-member-or-owner: "<red>You must be the island owner or an island member to prestige.</red>"
    prestige-in-progress: "<red>Another player has already initiated the process of prestiging your island.</red>"
    not-enough-items: "<red>Online island members collectively do not have enough items to prestige.</red>"
    not-enough-money: "<red>Island members collectively do not have enough money to prestige.</red>"
    not-enough-prestige-points: "<red>You do not have enough prestige points to prestige.</red>"
    quest-incomplete: "<red>You have not completed the quest <white><quest_id></white>, which is required to prestige.</red>"
    island-opted-out: "<red>You cannot prestige an island that is opted out of prestige.</red>"
    prestige-config-error: "<red>Unable to prestige your island due to a configuration error.</red>"
    requirement-error: "<red>Unable to check the required prestige points due to a configuration error.</red>"
    prestige-announcement: "<green>Player <#0055ff><player></#0055ff> has reached prestige level <#0055ff><prestige_level></#0055ff>.</green>"
    prestige-island-member-message: "<green>Player <#0055ff><player></#0055ff> has prestiged the island you are a member of.</green>"
opt-in-messages:
    player-in-wrong-world: "<red>You must be in an island world to opt into prestige.</red>"
    player-not-on-island: "<red>You must be on your island to opt into prestige.</red>"
    island-not-owned: "<red>You cannot opt into prestige for an island that is not owned.</red>"
    player-not-member-or-owner: "<red>You must be the island owner or an island member to opt into prestige.</red>"
    island-already-opted-in: "<red>Your island is already opted into prestige.</red>"
    island-member-message: "<green>Player <#0055ff><player></#0055ff> has opted into prestige for the island you are a member.</green>"
    opt-in-in-progress: "<red>Another player has already initiated the process of opting in your island to prestige.</red>"
opt-out-messages:
    player-in-wrong-world: "<red>You must be in an island world to opt of prestige.</red>"
    player-not-on-island: "<red>You must be on your island to opt out of prestige.</red>"
    island-not-owned: "<red>You cannot opt out of prestige for an island that is not owned.</red>"
    player-not-member-or-owner: "<red>You must be the island owner or an island member to opt out of prestige.</red>"
    island-already-opted-out: "<red>Your island is already opted out of prestige.</red>"
    island-member-message: "<green>Player <#0055ff><player></#0055ff> has opted out of prestige for the island you are a member.</green>"
    opt-out-in-progress: "<red>Another player has already initiated the process of opting your island out of prestige.</red>"
reward-messages:
    player-not-on-island: "<red>You must be on your island to view rewards.</red>"
    prestige-exempt: "<red>Your island is opted out of prestige. Prestige rewards can only be viewed for islands that can prestige.</red>"
    max-prestige-level: "<green>No rewards to view because your island is at the max prestige level.</green>"
    prestige-config-error: "<red>There is no configuration found for the prestige level <white><level></white>.</red>"
exchange-messages:
    player-not-on-island: "<red>You must be on your island to exchange prestige points.</red>"
    prestige-level-not-met: "<red>Your island doesn't meet the required prestige level to exchange prestige points.</red>"
    prestige-exempt: "<red>Your island is opted out of prestige. Only islands that can prestige can exchange prestige points.</red>"
    prestige-in-progress: "<red>You cannot exchange prestige points while your island is in the process of prestiging.</red>"
    opt-out-in-progress: "<red>You cannot exchange prestige points while your island is in the process of opting out of prestige.</red>"
    not-enough-prestige-points: "<red>You do not have enough prestige points to exchange.</red>"
vault-messages:
    player-not-on-island: "<red>You must be on your island to view the island vault.</red>"
    item-not-allowed: "<red>The item you clicked is not allowed to be placed inside the vault.</red>"
    prestige-exempt: "<red>Your island is opted out of prestige. The vault can only be used by islands opted into prestige.</red>"
    prestige-in-progress: "<red>You cannot modify the vault while your island is in the process of prestiging.</red>"
    opt-out-in-progress: "<red>You cannot modify the vault while your island is in the process of opting out of prestige.</red>"
requirement-messages:
    player-not-on-island: "<red>You must be on your island to view prestige requirements.</red>"
    island-not-owned: "<red>You cannot view prestige requirements for an island that is not owned.</red>"
    player-not-member-or-owner: "<red>You must be the island owner or an island member to view prestige requirements.</red>"
    prestige-exempt: "<red>Your island is opted out of prestige. Prestige requirements can only be viewed for islands that can prestige.</red>"
    max-prestige-level: "<green>No requirements to view because your island is at the max prestige level.</green>"
    prestige-config-error: "<red>There is no configuration found for the prestige level <white><level></white>.</red>"
    requirements-config-error: "<red>Unable to view prestige level requirements due to a configuration error.</red>"
leaderboard-messages:
    island-exempt: "<green>Island <yellow><island_id></yellow> is now exempt from leaderboard.</green>"
    island-unexempt: "<green>Island <yellow><island_id></yellow> is now unexempt from leaderboard.</green>"
    leaderboard-title: "<green><bold>Top 10 Islands By Prestige Level and Points</bold></green>"
    leaderboard-position: "<gray>[</gray><aqua><position></aqua><gray>]</gray> <yellow><player_name></yellow> <white>Level:</white> <aqua><prestige_level></aqua> <white>Points:</white> <aqua><prestige_points></aqua>"
    leaderboard-position-empty: "<gray>[</gray><aqua><position></aqua><gray>] ----------</gray>"
protection-orb-messages:
    protection-orb-not-allowed: "<red>This item can not be protected by a protection orb.</red>"
    protection-orb-already-protected: "<red>This item is already protected by a protection orb.</red>"
    protection-orb-protected: "<green>This item is now protected and will not be removed on prestige.</green>"
multiplier-messages:
