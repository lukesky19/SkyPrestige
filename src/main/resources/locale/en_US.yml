        prefix: ""
        years: "<aqua><years></aqua> year(s)"
        months: "<aqua><months></aqua> month(s)"
        weeks: "<aqua><weeks></aqua> week(s)"
        days: "<aqua><days></aqua> day(s)"
        hours: "<aqua><hours></aqua> hour(s)"
