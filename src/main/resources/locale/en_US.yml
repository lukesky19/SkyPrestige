prestige-player-in-wrong-world: "<red>You must be in an island world to prestige.</red>"
prestige-player-not-on-island: "<red>You must be on your island to prestige it.</red>"
prestige-island-not-owned: "<red>You cannot prestige an island that is not owned.</red>"
prestige-player-not-member-or-owner: "<red>You must be the island owner or an island member to prestige.</red>"
prestige-not-enough-prestige-points: "<red>You do not have enough prestige points to prestige.</red>"
