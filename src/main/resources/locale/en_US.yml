    server-multiplier-no-time-limit: "<green>The prestige points server multiplier is <aqua><multiplier></aqua> with no time limit.</green>"
    island-multiplier-time-limit: "<green>The prestige points island multiplier is <aqua><multiplier></aqua> with <time> remaining.</green>"
    island-multiplier-no-time-limit: "<green>The prestige points island multiplier is <aqua><multiplier></aqua> with no time limit.</green>"
    server-multiplier-cleared: "<green>The server's prestige points multiplier has been cleared.</green>"
    island-multiplier-cleared: "<green>The island's prestige points multiplier has been cleared.</green>"
    effective-multiplier: "<green>Your prestige points effective multiplier is <aqua><multiplier></aqua>.</green>"
