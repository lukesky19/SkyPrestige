# DO NOT TOUCH! This is used to update the config file format if needed.
config-version: 2.0.0.0
# The file in SkyPrestige/locale to use.
locale: en_US
# How frequently island data is periodically saved. Island data are also saved on player disconnect and server shutdown.
save-frequency-seconds: 900
# The required prestige level necessary to exchange prestige points.
exchange-prestige-level: 0
# The number of pipe symbols (|) to use in the progress bar placeholders.
progress-bar-size: 10
# Whether islands should start opted out of prestige or not.
start-opted-out: false
# Whether to apply opt-in rewards for initial (first) islands.
apply-opt-in-rewards-for-initial-islands: false
# Whether to apply opt-out rewards for initial (first) islands.
apply-opt-out-rewards-for-initial-islands: false
# These settings apply when an island is reset outside of prestige, opt-in, or opt-out.
island-reset-settings:
    keep-island-size: true
    keep-generator-upgrades: true
    keep-island-flags: true
    reset-prestige-points: true
    reset-prestige-level: false
    clear-vault: false