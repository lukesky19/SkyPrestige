        - minecraft:magenta_shulker_box
        - minecraft:pink_shulker_box
    protected-lore: "<gray>This item is now protected and will not be removed on prestige.</gray>"
# These settings are for the automated prestige points multiplier event.
multiplier-event-settings:
    # Is the automated prestige points multiplier event active.
    enabled: true
    # The timezone to use.
    timezone: "America/New_York"
    # The starting day
    day: SUNDAY
    # The starting hour, 0-23 format.
    hour: 10
    # The duration of the event in seconds
    duration-seconds: 86400
    # The multiplier to apply.
    multiplier: 2.0
# Requires SkyPlayTime
award-points-while-afk: false
# The formula used to scale requirements.
scale-formula: r*(1+((p-1)/(k)))
# The required prestige level necessary to exchange prestige points.
exchange-prestige-level: 0
# The fallback location to teleport players to if unable to teleport them to an island.
fallback-location:
    world: world
    x: 0
    y: 64
    z: 0
