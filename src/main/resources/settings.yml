# DO NOT TOUCH! This is used to update the config file format if needed.
config-version: 1.0.0.1
# The file in SkyPrestige/locale to use.
locale: en_US
# How frequently island data is periodically saved. Island data are also saved on player disconnect and server shutdown.
save-frequency-seconds: 900
# When a player uses /is reset, should their prestige level be reset to 0 too?
reset-prestige-level-on-island-reset: false
# Requires SkyPlayTime
award-points-while-afk: false
# The formula used to scale requirements.
scale-formula: r*(1+((p-1)/(k)))
# The required prestige level necessary to exchange prestige points.
exchange-prestige-level: 0
# The fallback location to teleport players to if unable to teleport them to an island.
fallback-location:
    world: world
    x: 0
    y: 64
    z: 0
# The list of namespaced keys for items not allowed inside vaults.
vault-disallowed-items:
    - minecraft:spawner
    - minecraft:cod
    - minecraft:tropical_fish
    - minecraft:salmon
    - minecraft:cooked_cod
    - minecraft:cooked_salmon
    - minecraft:pufferfish
    - minecraft:player_head
    - minecraft:iron_ore
    - minecraft:deepslate_iron_ore
    - minecraft:raw_iron
    - minecraft:raw_iron_block
    - minecraft:iron_ingot
    - minecraft:iron_nugget
    - minecraft:iron_block
    - minecraft:gold_ore
    - minecraft:deepslate_gold_ore
    - minecraft:nether_gold_ore
    - minecraft:raw_gold
    - minecraft:raw_gold_block
    - minecraft:gold_ingot
    - minecraft:gold_nugget
    - minecraft:gold_block
    - minecraft:emerald_ore
    - minecraft:deepslate_emerald_ore
    - minecraft:emerald
    - minecraft:emerald_block
    - minecraft:diamond_ore
    - minecraft:deepslate_diamond_ore
    - minecraft:diamond
    - minecraft:diamond_block
    - minecraft:ancient_debris
    - minecraft:netherite_scrap
    - minecraft:netherite_ingot
    - minecraft:netherite_block
