# DO NOT TOUCH! This is used to update the config file format if needed.
config-version: 1.1.0.0
# The file in SkyPrestige/locale to use.
locale: en_US
# How frequently island data is periodically saved. Island data are also saved on player disconnect and server shutdown.
save-frequency-seconds: 900
# These settings apply when an island is reset outside of prestige.
island-reset-settings:
    keep-island-range: false
    keep-generator-upgrades: false
    reset-prestige-points: true
    reset-prestige-level: false
# These settings are related to the protection orb.
protection-orb-settings:
    item-stack-config:
        item-type: minecraft:heart_of_the_sea
        name: "<gold><bold>Protection Orb</bold></gold>"
        lore:
            - "<gray>Click an item with this and it will not be removed on prestige!</gray>"
        amount: 1
        options:
            enchantment-glint: true
    disallowed-items:
        - minecraft:spawner
        - minecraft:iron_ore
        - minecraft:deepslate_iron_ore
        - minecraft:raw_iron
        - minecraft:raw_iron_block
        - minecraft:iron_ingot
        - minecraft:iron_nugget
        - minecraft:iron_block
        - minecraft:gold_ore
        - minecraft:deepslate_gold_ore
        - minecraft:nether_gold_ore
